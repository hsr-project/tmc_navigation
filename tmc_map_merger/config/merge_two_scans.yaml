map_merger:
  ros__parameters:
    fixed_frame: map
    origin_frame: base_footprint
    publish_rate: 2.0
    root:
      merger: simple
      width: 7.0
      height: 7.0
      resolution: 0.05
    inputs:
      scan_1:
        topic_name: "scan_1"
        type: "sensor_msgs/LaserScan"
        rate: 5.0
        merger: simple_memory
        width: 7.0
        height: 7.0
        resolution: 0.05
        keep_time: 5.0
        default_data: -1
        point_cloud_filters:
          voxel_grid:
            order: 1
            type: "voxel_grid"
            leaf_size: 0.05
          transform:
            order: 2
            type: "transform"
          trimming:
            order: 3
            type: "trimming"
            field_name: "z"
            min: 0.15
            max: 1.5
          noise:
            type: "noise"
            radius: 0.1
            min_neighbors: 1
        obstacle_circle:
          forbid_radius: 0.25
          obstacle_radius: 0.35
          obstacle_occupancy: 10
      scan_2:
        topic_name: "scan_2"
        type: "sensor_msgs/LaserScan"
        rate: 5.0
        merger: simple_memory
        width: 7.0
        height: 7.0
        resolution: 0.05
        keep_time: 5.0
        default_data: -1
        point_cloud_filters:
          voxel_grid:
            order: 1
            type: "voxel_grid"
            leaf_size: 0.05
          transform:
            order: 2
            type: "transform"
          trimming:
            order: 3
            type: "trimming"
            field_name: "z"
            min: 0.15
            max: 1.5
          noise:
            type: "noise"
            radius: 0.1
            min_neighbors: 1
        obstacle_circle:
          forbid_radius: 0.25
          obstacle_radius: 0.35
          obstacle_occupancy: 10
