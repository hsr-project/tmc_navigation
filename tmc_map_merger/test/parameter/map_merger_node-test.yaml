map_merger:
  ros__parameters:
    fixed_frame: map
    origin_frame: base
    publish_rate: 30.0
    root:
      merger: simple
      width: 7.0
      height: 7.0
      resolution: 0.05
    inputs:
      test_points:
        topic_name: "test_points"
        type: "sensor_msgs/PointCloud2"
        rate: 30.0
        merger: simple_memory
        width: 7.0
        height: 7.0
        resolution: 0.05
        keep_time: 5.0
        default_data: -1
        point_cloud_filters:
          voxel_grid:
            type: "voxel_grid"
            leaf_size: 0.05
          transform:
            type: "transform"
          trimming:
            type: "trimming"
            field_name: "z"
            min: 0.15
            max: 1.5
          noise:
            type: "noise"
            radius: 0.1
            min_neighbors: 1
        obstacle_circle:
          forbid_radius: 0.25
          obstacle_radius: 0.35
          obstacle_occupancy: 10
      test_scan:
        topic_name: "test_scan"
        type: "sensor_msgs/LaserScan"
        rate: 30.0
        merger: simple_memory
        width: 7.0
        height: 7.0
        resolution: 0.05
        keep_time: 5.0
        default_data: -1
        point_cloud_filters:
          voxel_grid:
            type: "voxel_grid"
            leaf_size: 0.05
          transform:
            type: "transform"
          trimming:
            type: "trimming"
            field_name: "z"
            min: 0.15
            max: 1.5
          noise:
            type: "noise"
            radius: 0.1
            min_neighbors: 1
        obstacle_circle:
          forbid_radius: 0.25
          obstacle_radius: 0.35
          obstacle_occupancy: 10
